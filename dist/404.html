  <!-- CWV INP: Defer ALL third-party scripts until after first paint to avoid main-thread blocking -->
  <script>
    function hasAnalyticsConsent() {
      try {
        return (
          localStorage.getItem('cookie_consent') === 'accepted' ||
          localStorage.getItem('analytics_consent') === 'accepted'
        );
      } catch (error) {
        return false;
      }
    }

    // GTM — load only after consent and only after first paint
    function loadGTM() {
      if (window.__PRERENDER_INJECTED || window.__gtmLoaded || !hasAnalyticsConsent()) {
        return;
      }

      window.__gtmLoaded = true;
      var w = window, d = document, s = 'script', l = 'dataLayer', i = 'GTM-NQRJFFZJ';
      w[l] = w[l] || [];
      w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != 'dataLayer' ? '&l=' + l : '';
      j.async = true;
      j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
      f.parentNode.insertBefore(j, f);
    }

    function scheduleGTM() {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function () { loadGTM(); }, { timeout: 3500 });
        return;
      }

      setTimeout(function () { loadGTM(); }, 2500);
    }

    scheduleGTM();
    window.addEventListener('analytics-consent-given', scheduleGTM);
  </script>
