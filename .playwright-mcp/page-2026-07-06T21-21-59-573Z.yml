              - generic [ref=f4e909]: How much does dental digital marketing cost in California?
              - img [ref=f4e911]
            - generic [ref=f4e913]: Dental digital marketing in California typically ranges from $1,500 to $8,000+/month depending on the channels managed, market competitiveness, and whether the engagement covers a single practice or a DSO with multiple locations. GrowLimo's dental marketing programs start at $1,297/month for single-channel engagements and scale to comprehensive omnichannel programs for California DSOs.
          - generic [ref=f4e914]:
            - button "How quickly will dental digital marketing generate new patients in California?" [ref=f4e915] [cursor=pointer]:
