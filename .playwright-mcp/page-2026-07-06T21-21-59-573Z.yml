              - img [ref=f4e918]
            - generic [ref=f4e920]: Google Ads and Meta Ads campaigns generate patient inquiries within 24–72 hours of launch. Local SEO and Google Business Profile improvements typically appear within 4–8 weeks. Organic keyword ranking improvements for dental treatment terms take 4–9 months depending on California market competitiveness. An integrated dental marketing program produces compounding returns over 6–12 months as each channel reinforces the others.
          - generic [ref=f4e921]:
            - button "Does GrowLimo specialize specifically in dental marketing or is it a general agency?" [ref=f4e922] [cursor=pointer]:
